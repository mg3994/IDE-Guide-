[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ide-guide"
version = "1.0.0"
description = "IDE Guide - Automated AMP HTML blog post and Google Flow video spec generator"
readme = "README.md"
requires-python = ">=3.8"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
