name: Daily IDE Guide Content Generation

on:
  schedule:
    # Runs at 21:30 UTC daily (03:00 AM IST next morning)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate-daily-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Daily Content Generator
        run: |
          python3 scripts/generate_daily_content.py

      - name: Validate AMP HTML Output
        run: |
          for file in content/*/*.html; do
            if [ -f "$file" ]; then
              python3 scripts/amp_validator.py "$file"
            fi
          done

      - name: Commit and Push Generated Daily Content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily automated content package generation"
          branch: main
