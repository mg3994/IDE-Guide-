name: Daily Content Generation

on:
  schedule:
    # Runs every day at 21:30 UTC (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Generate 3 Daily Blog Posts and Video Specs
        run: |
          python3 scripts/generate_daily_content.py

      - name: Run Test Suite & AMP Validation Checks
        run: |
          PYTHONPATH=. pytest tests/

      - name: Commit and Push New Daily Content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "chore(content): automated daily content generation [skip ci]" || echo "No changes to commit"
          git push
