name: Daily Content Generation

on:
  schedule:
    # Runs daily at 21:30 UTC (3:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run daily content generation
        run: |
          python3 scripts/generate_daily_content.py

      - name: Validate generated AMP blog posts
        run: |
          for file in content/*/*.html; do
            if [ -f "$file" ]; then
              python3 scripts/amp_validator.py "$file"
            fi
          done

      - name: Commit and push generated content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "chore(content): automated daily AMP posts & Google Flow video specs [skip ci]" || echo "No changes to commit"
          git push
