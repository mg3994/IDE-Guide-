name: Daily Content Generation Engine

on:
  schedule:
    # Runs every day at 21:30 UTC (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Generate Daily AMP Posts & Google Flow Video Specs
        run: |
          python3 scripts/generate_daily_content.py

      - name: Run Validation Tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Commit and Push Daily Content Artifacts
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/
          if git diff --staged --quiet; then
            echo "No new content changes to commit."
          else
            git commit -m "chore(content): auto-generate daily AMP posts & Google Flow video specs"
            git push
          fi
