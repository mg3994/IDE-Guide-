name: Daily IDE Guide Content Generation

on:
  schedule:
    # Runs daily at 21:30 UTC (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run AMP & Skill Tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Generate 3 Daily Blog Posts & Flow Video Specs
        run: |
          PYTHONPATH=. python3 scripts/generate_daily_content.py

      - name: Commit & Push Daily Content
        run: |
          git config user.name "IDE Guide Automation Bot"
          git config user.email "bot@ideguide.publication"
          git add content/
          if git diff --staged --quiet; then
            echo "No new daily content generated to commit."
          else
            git commit -m "Auto-generate daily IDE Guide packages [$(date +'%Y-%m-%d')]"
            git push
          fi
