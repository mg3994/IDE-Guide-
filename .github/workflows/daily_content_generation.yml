name: Daily IDE Guide Content Generation

on:
  schedule:
    # Runs daily at 21:30 UTC (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Daily Content Generator
        run: |
          PYTHONPATH=. python3 scripts/generate_daily_content.py

      - name: Validate AMP HTML Output
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          for f in content/$TODAY/*.html; do
            python3 scripts/amp_validator.py "$f"
          done

      - name: Commit and Push Generated Content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: Generate 3 daily IDE guide packages [skip ci]"
          branch: main
