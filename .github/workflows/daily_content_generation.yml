name: Daily IDE Guide Content Generation

on:
  schedule:
    # Runs daily at 21:30 UTC (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run AMP HTML and Package Tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Generate Daily Content (3 Blog Posts & 3 Google Flow Specs)
        run: |
          PYTHONPATH=. python3 scripts/generate_daily_content.py

      - name: Commit and Push Generated Content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          git status
          git diff-index --quiet HEAD || git commit -m "auto: Generate daily AMP blog posts and Google Flow video specs"
          git push
