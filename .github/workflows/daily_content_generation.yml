name: Daily Content Generation & Validation

on:
  schedule:
    # Runs daily at 21:30 UTC (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Generate Daily Content
        run: |
          python scripts/generate_daily_content.py

      - name: Validate AMP HTML Output
        run: |
          DATE_STR=$(date -u +'%Y-%m-%d')
          for file in content/${DATE_STR}/*.amp.html; do
            if [ -f "$file" ]; then
              python scripts/amp_validator.py "$file"
            fi
          done
