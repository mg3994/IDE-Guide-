name: IDE Guide Daily Content Generation

on:
  schedule:
    # Runs daily at 21:30 UTC (03:00 AM IST) to generate 3 daily videos & blogposts
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run daily content generator
        run: |
          python3 scripts/generate_daily_content.py

      - name: Validate generated AMP HTML blog posts
        run: |
          DATE_DIR=$(date -u +'%Y-%m-%d')
          for file in content/${DATE_DIR}/blog_*.html; do
            python3 scripts/amp_validator.py "$file"
          done

      - name: Run unit test suite
        run: |
          PYTHONPATH=. pytest tests/

      - name: Commit and push generated content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "Automated Content Generation: $(date -u +'%Y-%m-%d')" || exit 0
          git push
