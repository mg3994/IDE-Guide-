name: Daily Content Generation Workflow

on:
  schedule:
    # Runs daily at 21:30 UTC (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run unit tests
        run: |
          pytest tests/

      - name: Generate daily content package
        run: |
          PYTHONPATH=scripts python3 scripts/generate_daily_content.py

      - name: Commit and push generated content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "No new content to commit."
          else
            git commit -m "Add daily AMP blog posts and Google Flow video specs [$(date -u +'%Y-%m-%d')]"
            git push
          fi
