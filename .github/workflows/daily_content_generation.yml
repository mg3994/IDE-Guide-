name: Daily IDE Guide Content Generation

on:
  schedule:
    # Runs at 21:30 UTC every day (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Test Suite
        run: |
          pytest tests/

      - name: Generate Daily Content
        run: |
          python scripts/generate_daily_content.py

      - name: Commit and Push Daily Content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "chore: generate daily IDE Guide content package [skip ci]" || echo "No changes to commit"
          git push
