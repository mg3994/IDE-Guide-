name: Daily IDE Content Generation

on:
  schedule:
    # Runs every day at 21:30 UTC (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Daily Content Generator
        run: |
          PYTHONPATH=. python scripts/generate_daily_content.py

      - name: Commit and push generated content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate daily IDE Guide blog posts and video specs"
          file_pattern: "content/*"
