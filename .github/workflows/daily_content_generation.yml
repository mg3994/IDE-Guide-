name: IDE Guide Daily Content Generator

on:
  schedule:
    # Runs every day at 21:30 UTC (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-daily-posts-and-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Generate Daily Content (3 Posts + 3 Video Specs)
        run: |
          python3 scripts/generate_daily_content.py

      - name: Verify AMP Compliance & Run Tests
        run: |
          PYTHONPATH=. pytest tests/

      - name: Commit and Push Daily Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if git status --porcelain | grep -q .; then
            git commit -m "automation: generate daily 3x AMP posts and Google Flow video specs"
            git push
          else
            echo "No new daily content changes to commit."
          fi
