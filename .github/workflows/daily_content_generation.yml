name: Daily Content Generation

on:
  schedule:
    # Runs at 21:30 UTC daily (03:00 AM IST next day)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run daily content generator
        run: |
          PYTHONPATH=. python3 scripts/generate_daily_content.py

      - name: Commit and push generated content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated daily content generation [3 blog posts & 3 video specs]"
          file_pattern: 'content/*'
