name: Daily IDE Guide Content Generation

on:
  schedule:
    # Runs daily at 21:30 UTC (03:00 AM IST) to prepare 3 posts and 3 videos for the next day
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-daily-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Daily Content Generator
        run: |
          python3 scripts/generate_daily_content.py

      - name: Commit and Push Generated Content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "No new content to commit."
          else
            git commit -m "chore(content): automated daily content generation for $(date -u +'%Y-%m-%d')"
            git push
          fi
