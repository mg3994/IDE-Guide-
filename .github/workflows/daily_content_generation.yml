name: Daily Content Generation - IDE Guide

on:
  schedule:
    # Runs at 21:30 UTC daily (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Daily AMP Posts and Video Specs
        run: |
          python3 scripts/generate_daily_content.py

      - name: Commit and Push Generated Content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git diff --quiet && git diff --staged --quiet || (git commit -m "automation: generate daily AMP posts and video specs for $(date +'%Y-%m-%d')" && git push)
