name: Daily Content Generation

on:
  schedule:
    # Runs every day at 21:30 UTC (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Daily Content Generator
        run: |
          python3 scripts/generate_daily_content.py

      - name: Run Unit Tests
        run: |
          pytest tests/

      - name: Commit and Push Daily Content Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "chore(daily): generate daily AMP posts and Google Flow video specs"
            git push
          fi
