name: Daily IDE Guide Content Generation

on:
  schedule:
    # Run daily at 21:30 UTC (03:00 AM IST) to generate 3 blog posts and 3 video specs
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Unit Tests
        run: |
          pytest tests/

      - name: Generate Daily Content
        run: |
          python3 scripts/generate_daily_content.py

      - name: Commit and Push Generated Content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "No new content to commit."
          else
            git commit -m "chore(content): generate daily AMP blog posts and Google Flow video specs"
            git push
          fi
