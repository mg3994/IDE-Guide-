name: Daily Content Generation Workflow

on:
  schedule:
    # Runs at 21:30 UTC every day (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate-daily-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Daily Content
        run: |
          python3 scripts/generate_daily_content.py

      - name: Commit and Push Updated Content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "Automated Daily Content Generation - $(date -u +'%Y-%m-%d')" || exit 0
          git push
