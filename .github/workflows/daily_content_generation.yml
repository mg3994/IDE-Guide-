name: Daily IDE Guide Content Generation

on:
  schedule:
    # Run daily at 21:30 UTC (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run unit tests & AMP validation
        run: |
          PYTHONPATH=. pytest tests/

      - name: Generate daily content (3 AMP blog posts & 3 Google Flow video specs)
        run: |
          PYTHONPATH=. python3 scripts/generate_daily_content.py

      - name: Commit and push generated content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "chore(content): generate daily AMP blog posts and video specs [skip ci]" || echo "No changes to commit"
          git push
