name: Daily Content Generation (IDE Guide)

on:
  schedule:
    # Runs at 21:30 UTC daily (03:00 AM IST next day)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run AMP HTML & Google Flow Daily Content Generator
        run: |
          python scripts/generate_daily_content.py

      - name: Validate AMP HTML Outputs
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          for file in content/${TODAY}/*.html; do
            if [ -f "$file" ]; then
              python scripts/amp_validator.py "$file"
            fi
          done

      - name: Commit and Push Generated Content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Daily Content Package: $(date -u +'%Y-%m-%d')" && git push)
