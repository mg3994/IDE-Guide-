name: Daily Content Generation

on:
  schedule:
    # Runs every day at 21:30 UTC (03:00 AM IST next day)
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-daily-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Daily Content Generation Engine
        run: |
          python scripts/generate_daily_content.py

      - name: Commit and Push Generated Content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "auto: Generate daily content package for $(date -u +'%Y-%m-%d')" || exit 0
          git push
