name: Daily Content Generation

on:
  schedule:
    # 21:30 UTC = 03:00 AM IST
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Generate Daily Content (3 Blog Posts & 3 Video Specs)
        run: |
          python3 scripts/generate_daily_content.py

      - name: Run Test Suite
        run: |
          pytest tests/

      - name: Commit and Push Generated Content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(content): generate daily IDE Guide content package"
            git push
          fi
