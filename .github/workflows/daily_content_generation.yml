name: Daily Content Generation

on:
  schedule:
    # Runs at 21:30 UTC daily (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run test suite
        run: |
          pytest tests/

      - name: Generate daily content packages
        run: |
          python3 scripts/generate_daily_content.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: generate daily IDE Guide content packages [skip ci]" && git push)
