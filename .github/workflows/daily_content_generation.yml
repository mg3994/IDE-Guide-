name: Daily Content Generation - IDE Guide

on:
  schedule:
    # Runs at 21:30 UTC every day (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Generate 3 Daily AMP Blog Posts & Google Flow Video Specs
        run: |
          python3 scripts/generate_daily_content.py

      - name: Validate AMP HTML Compliance
        run: |
          python3 scripts/amp_validator.py content/

      - name: Commit and Push Daily Content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(daily-content): publish 3 daily blog posts and video specs [skip ci]" && git push)
