name: Daily IDE Guide Content Generation

on:
  schedule:
    # 21:30 UTC = 03:00 AM IST (every day)
    - cron: '30 21 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target publication date (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  generate-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Daily Content Generator
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python3 scripts/generate_daily_content.py "${{ github.event.inputs.target_date }}"
          else
            python3 scripts/generate_daily_content.py
          fi

      - name: Validate Generated AMP HTML
        run: |
          for f in content/*/*_amp.html; do
            echo "Validating $f..."
            python3 scripts/amp_validator.py "$f"
          done

      - name: Commit and Push New Daily Content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-generate daily 3 videos & 3 AMP blog posts [skip ci]"
            git push
          fi
