name: Daily Content Generation

on:
  schedule:
    # Runs at 21:30 UTC daily (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Daily AMP Posts and Video Specs
        run: |
          python3 scripts/generate_daily_content.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "No new content to commit."
          else
            git commit -m "chore(content): generate daily AMP posts and Google Flow video specs [skip ci]"
            git push
          fi
