name: Daily Content Generation

on:
  schedule:
    # Runs at 21:30 UTC daily (which corresponds to 03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

jobs:
  generate_and_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Generate Daily Content Package
        run: |
          python3 scripts/generate_daily_content.py

      - name: Validate Generated AMP HTML Files
        run: |
          for file in content/*/*.html; do
            echo "Validating $file..."
            python3 scripts/amp_validator.py "$file"
          done

      - name: Run Test Suite
        run: |
          PYTHONPATH=. pytest tests/

      - name: Commit and Push Updated Content & History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Daily Content Generation [skip ci]" && git push)
