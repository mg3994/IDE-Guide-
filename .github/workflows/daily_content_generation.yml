name: Daily IDE Guide Content Generation

on:
  schedule:
    # Runs daily at 21:30 UTC (03:00 AM IST)
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Daily Content Generator Engine
        run: |
          python3 scripts/generate_daily_content.py

      - name: Commit and Push Generated Content
        run: |
          git config --global user.name "IDE Guide Bot"
          git config --global user.email "bot@ideguide.blogspot.com"
          git add content/
          if git diff --staged --quiet; then
            echo "No new daily content to commit."
          else
            git commit -m "automation: generate daily IDE Guide blog posts and video specs [skip ci]"
            git push
          fi
